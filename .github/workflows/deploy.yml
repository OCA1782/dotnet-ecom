# Deploy artık Admin paneli üzerinden yönetilmektedir (Admin > Deploy > Sunucular).
# Bu workflow devre dışıdır; otomatik tetiklenmez.
# Gerekirse GitHub UI'dan "Run workflow" ile manuel başlatılabilir.

name: Deploy (Devre Dışı)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Deploy sebebi'
        required: false
        default: 'Manuel deploy'

jobs:
  deploy:
    name: Deploy (Admin panelinden yönetilir)
    runs-on: ubuntu-latest
    steps:
      - name: Bilgi
        run: |
          echo "Deploy işlemleri Admin paneli üzerinden yapılmaktadır."
          echo "Admin > Deploy > Sunucular bölümünden ilgili sunucuyu seçip Deploy butonuna basın."
          echo "Sebep: ${{ github.event.inputs.reason }}"
